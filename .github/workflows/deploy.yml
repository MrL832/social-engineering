name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build (or prepare static site)
        id: build
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pnpm-lock.yaml" ]]; then
            corepack enable
            pnpm --version
            pnpm install --frozen-lockfile
            pnpm run build
          elif [[ -f "package-lock.json" ]]; then
            npm ci
            npm run build
          elif [[ -f "package.json" ]]; then
            npm install
            npm run build
          else
            echo "No package.json found. Treating repository as a static site (no build step)."
          fi

          if [[ -d "dist" ]]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
          elif [[ -d "build" ]]; then
            echo "path=build" >> "$GITHUB_OUTPUT"
          else
            if [[ -f "package.json" ]]; then
              echo "Build completed but no dist/ or build/ directory found." >&2
              echo "Update this workflow to upload your actual output folder." >&2
              exit 1
            fi
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

